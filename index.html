<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anca Kebab • Kebab & Bakso Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #e6392e; }
        body { font-family: 'Segoe UI', sans-serif; }
        .hero { height: 100vh; background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('https://source.unsplash.com/1600x900/?kebab') center/cover no-repeat; display: flex; align-items: center; }
        .navbar { background: rgba(255,255,255,0.95) !important; backdrop-filter: blur(12px); }
        .card-product { border: none; border-radius: 20px; transition: all 0.4s; }
        .card-product:hover { transform: translateY(-15px); box-shadow: 0 20px 40px rgba(230,57,46,0.3); }
        .qr-code { border: 5px solid #e6392e; border-radius: 20px; padding: 15px; background: white; }
        .section-title { font-size: 2.8rem; font-weight: 800; background: linear-gradient(90deg, #e6392e, #f4a261); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-danger" href="#"><i class="fas fa-fire"></i> Anca Kebab</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#menu">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="#kelola">Kelola QR</a></li>
                    <button class="btn btn-outline-danger ms-3" onclick="toggleCart()">
                        <i class="fas fa-shopping-cart"></i> 
                        <span id="cart-count" class="badge bg-danger ms-1">0</span>
                    </button>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero text-white">
        <div class="container text-center">
            <h1 class="display-1 fw-bold">ANCA KEBAB</h1>
            <p class="lead fs-3">Kebab & Bakso Premium • Rasa Juara</p>
            <a href="#menu" class="btn btn-danger btn-lg px-5 py-3 mt-3">Lihat Menu</a>
        </div>
    </section>

    <!-- Menu -->
    <section id="menu" class="py-5 bg-light">
        <div class="container">
            <h2 class="section-title text-center mb-5">Menu Favorit</h2>
            <div class="row g-4" id="product-list"></div>
        </div>
    </section>

    <!-- Kelola QR Code -->
    <section id="kelola" class="py-5 bg-white">
        <div class="container">
            <h4 class="text-center mb-4">⚙️ Kelola QR Code Pembayaran</h4>
            <div class="card mx-auto" style="max-width: 520px;">
                <div class="card-body">
                    <input type="file" id="qrUpload" accept="image/*" class="form-control mb-3">
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <button onclick="uploadQR()" class="btn btn-danger flex-fill me-md-2">Upload QR Code</button>
                        <button onclick="hapusQR()" class="btn btn-outline-danger flex-fill">Hapus QR Code</button>
                    </div>
                    <div id="preview-qr" class="text-center mt-4"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal Keranjang -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">🛒 Keranjang Belanja</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="cart-items"></div>
                <div class="modal-footer flex-column">
                    <div class="w-100 d-flex justify-content-between fs-4 mb-4">
                        <strong>Total :</strong>
                        <strong id="cart-total" class="text-danger">Rp0</strong>
                    </div>
                    <button onclick="pilihCOD()" class="btn btn-outline-success w-100 mb-2 py-3">COD - Bayar di Tempat</button>
                    <button onclick="bayarQRIS()" class="btn btn-warning w-100 mb-2 py-3">Bayar dengan QRIS</button>
                    <button onclick="transferManual()" class="btn btn-info w-100 py-3">Transfer Bank Manual</button>
                </div>
            </div>
        </div>
    </div>

   <!-- QRIS Modal (Ganti yang lama dengan ini) -->
<div class="modal fade" id="qrisModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">💳 Bayar dengan QRIS</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center" id="qris-content">
                <!-- QR Code akan muncul di sini -->
            </div>
            <div class="modal-footer">
                <button onclick="confirmPayment()" class="btn btn-success w-100 py-3">
                    ✅ Saya Sudah Bayar
                </button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cart = [];
        let qrCodeImage = localStorage.getItem('qrCodeImage') || null;

        const products = [
            { id: 1, name: "Anca Kebab Daging", price: 22000, img: "https://source.unsplash.com/300x200/?kebab" },
            { id: 2, name: "Bakso Urat Spesial", price: 18000, img: "https://source.unsplash.com/300x200/?meatballs" },
            { id: 3, name: "Bakso Malang Komplit", price: 25000, img: "https://source.unsplash.com/300x200/?indonesian-food" }
        ];

        function renderProducts() {
            const cont = document.getElementById('product-list');
            cont.innerHTML = '';
            products.forEach(p => {
                cont.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card card-product h-100">
                        <img src="${p.img}" class="card-img-top" style="height:220px;object-fit:cover;">
                        <div class="card-body">
                            <h5>${p.name}</h5>
                            <h5 class="text-danger">Rp${p.price.toLocaleString('id-ID')}</h5>
                            <button onclick="addToCart(${p.id})" class="btn btn-danger w-100 mt-2">Tambah ke Keranjang</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push({...product, qty: 1});
            updateCartCount();
        }

        function updateCartCount() {
            document.getElementById('cart-count').textContent = cart.length;
        }

        function toggleCart() {
            renderCart();
            new bootstrap.Modal(document.getElementById('cartModal')).show();
        }

        function renderCart() {
            let html = '', total = 0;
            const container = document.getElementById('cart-items');
            
            if (cart.length === 0) {
                html = `<p class="text-center py-5 text-muted">Keranjang kosong</p>`;
            } else {
                cart.forEach((item, i) => {
                    const subtotal = item.price * (item.qty || 1);
                    total += subtotal;
                    html += `<div class="d-flex justify-content-between mb-2"><span>${item.name} × ${item.qty||1}</span><span>Rp${subtotal.toLocaleString()}</span></div>`;
                });
            }
            container.innerHTML = html;
            document.getElementById('cart-total').textContent = `Rp${total.toLocaleString('id-ID')}`;
        }

        // Upload & Hapus QR
        function uploadQR() {
            const file = document.getElementById('qrUpload').files[0];
            if (!file) return alert("Pilih gambar QR Code!");
            const reader = new FileReader();
            reader.onload = function(e) {
                qrCodeImage = e.target.result;
                localStorage.setItem('qrCodeImage', qrCodeImage);
                showQRPreview();
                alert("✅ QR Code berhasil disimpan!");
            };
            reader.readAsDataURL(file);
        }

        function hapusQR() {
            if (confirm("Yakin ingin menghapus QR Code?")) {
                qrCodeImage = null;
                localStorage.removeItem('qrCodeImage');
                showQRPreview();
            }
        }

        function showQRPreview() {
            const preview = document.getElementById('preview-qr');
            preview.innerHTML = qrCodeImage ? 
                `<img src="${qrCodeImage}" style="max-width:280px; border:3px solid #e6392e; border-radius:15px;">` : 
                `<p class="text-muted">QRIS Default akan digunakan</p>`;
        }

        // Pembayaran
        function pilihCOD() {
            alert("✅ Pesanan COD telah dikirim ke WhatsApp!");
            resetCart();
        }

        function bayarQRIS() {
            if (cart.length === 0) return alert("Keranjang kosong!");
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const content = document.getElementById('qris-content');
            
            const qrSrc = qrCodeImage || `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=ANCAKEBAB-${Date.now()}`;

            content.innerHTML = `
                <h4>Total Pembayaran</h4>
                <h2 class="text-danger fw-bold">Rp${total.toLocaleString('id-ID')}</h2>
                <div class="qr-code mx-auto my-4" style="max-width: 320px;">
                    <img src="${qrSrc}" class="img-fluid" alt="QRIS">
                </div>
            `;
            bootstrap.Modal.getInstance(document.getElementById('cartModal')).hide();
            new bootstrap.Modal(document.getElementById('qrisModal')).show();
        }

        function transferManual() {
            alert("🏦 Transfer ke:\nBCA 8123456789\na.n. Anca Kebab\n\nKirim bukti transfer ke WhatsApp kami.");
            resetCart();
        }

        // Sound + Tutup Otomatis
        function playSuccessSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.4);
            gain.gain.value = 0.4;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);
            osc.connect(gain).connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1);
        }

        function confirmPayment() {
            const content = document.getElementById('qris-content');
            content.innerHTML = `<div class="text-success"><h1 class="display-1">🎉</h1><h4>Pembayaran Berhasil!</h4><p>Terima kasih ❤️</p></div>`;
            playSuccessSound();

            setTimeout(() => {
                bootstrap.Modal.getInstance(document.getElementById('qrisModal')).hide();
                resetCart();
            }, 2200);
        }

        function resetCart() {
            cart = [];
            updateCartCount();
        }

        window.onload = () => {
            renderProducts();
            showQRPreview();
        };
    </script>
</body>
</html>
